# Tutorial content data — safe to edit without touching code.
#
# This file holds only DATA: the tag labels and the ordered list of tutorials.
# It is read by tutorials.config.js. A pull request that changes ONLY this file
# needs no code review: the file is unowned in .github/CODEOWNERS, so it can be
# merged by its author once the "Check build" status is green. Every other file
# still requires a reviewed pull request.
#
# Because it skips review, the file is validated strictly (scripts/data-schema.js)
# before the build or any sync script uses it. The rules, in short:
#
#   slug   letters, digits and "-" only; unique across the file
#   tag    must exist under tags: below
#   repo   https://github.com/<owner>/<repo>[.git] — nothing else (no ssh,
#          no other hosts, no git options)
#   ref    plain branch/tag/SHA characters, may not start with "-"
#   dir    relative path inside the repo, no ".." segments
#   files  bare *.md filenames, keyed by en / sv
#   docs   Google Doc ids, keyed by en / sv
#
# Unknown fields are rejected. Run `node scripts/validate-data.js` locally to
# check before pushing.
#
# TAGS: tag slug -> display label per language (en / sv). Every tutorial's `tag`
# must exist here.
tags:
  app:         {en: Member app,           sv: Medlemsapp}
  courses:     {en: Courses,              sv: Kurser}
  wood:        {en: Wood workshop,        sv: Träverkstad}
  "3D":        {en: 3D Workshop,          sv: 3D-verkstad}
  electronics: {en: Electronics workshop, sv: Elektronikverkstad}

# TUTORIALS: ordered list; each entry is grouped under `tag` and pulls its
# markdown from the given source. Required fields: source, slug, tag.
#
#   umsme   entry needs only source/slug/tag (content lives in the umsme repo).
#   gdrive  entry adds  docs: {sv: <GoogleDocId>, en: <GoogleDocId>}  (one or both).
#   github  entry adds  repo: <git URL>  and optionally:
#             dir:   subdirectory within the repo (default repo root)
#             ref:   branch/tag/SHA      (default the remote's HEAD)
#             files: {sv: <main.md>, en: <main.md>}  (default {sv: README.md})
#
# The order below is the order tutorials appear in listings.
tutorials:
  # Member app
  - {source: umsme, slug: installApp,      tag: app}
  - {source: umsme, slug: existingMembers, tag: app}
  - {source: umsme, slug: newMembers,      tag: app}
  - {source: umsme, slug: renewMembership, tag: app}
  - {source: umsme, slug: manageFamily,    tag: app}

